<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=OpenSans">
    <link rel="stylesheet" href="/static/style.css">
    <title> Football Boots </title>
</head>
<body class="w3-container">
    <!-- Shared Logo Bar -->
     <header class="w3-container w3-padding-32">
        <img src="/static/Images/Football.png" alt="Football" class="football">
        <img src="/static/Images/Nike%20design.png" alt="Nike logo" class="Logo">
        <img src="/static/Images/Adidas%20design.png" alt="Adidas logo" class="Logo">
        <img src="/static/Images/Puma%20design.png" alt="Puma logo" class="Logo">
        <img src="/static/Images/Mizuno%20design.png" alt="Mizuno logo" class="Logo">
        <img src="/static/Images/New%20Balance%20design.png" alt="New Balance logo" class="Logo">
        <img src="/static/Images/Asics%20design.png" alt="Asics logo" class="Logo">
        <img src="/static/Images/Skechers%20design.png" alt="Sketchers logo" class="Logo">
        <img src="/static/Images/Under%20Armour%20design.png" alt="Under Armour logo" class="Logo">

     </header>
    <!-- Shared Nav Bar -->
     <nav class="w3-bar w3-gray">
        <a href="/" class="w3-bar-item w3-button">Home</a>
        <a href="/brand" class="w3-bar-item w3-button">Brands</a>
        <a href="/admin" class="w3-bar-item w3-button w3-right">Admin</a>
     </nav>
        

<div class="w3-container" style="max-width: 400px; margin: 60px auto;">

    <h1>Admin Login</h1>

    

    <form method="post">

        <label>Username</label>
        <input class="w3-input w3-border" style="margin-bottom: 12px;"
               type="text" name="username" required autofocus>

        <label>Password</label>
        <input class="w3-input w3-border" style="margin-bottom: 20px;"
               type="password" name="password" required>

        <button type="submit" class="w3-button w3-dark-grey w3-block">
            Log in
        </button>

    </form>

</div>


</body>
</html>
