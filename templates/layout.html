<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=OpenSans">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <title> Football Boots </title>
</head>
<body class="w3-container">
    <!-- Shared Logo Bar -->
     <header class="w3-container w3-padding-32">
        <img src="{{ url_for('static', filename='Images/Football.png') }}" alt="Football" class="football">
        <img src="{{ url_for('static', filename='Images/Nike design.png') }}" alt="Nike logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/Adidas design.png') }}" alt="Adidas logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/Puma design.png') }}" alt="Puma logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/Mizuno design.png') }}" alt="Mizuno logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/New Balance design.png') }}" alt="New Balance logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/Asics design.png') }}" alt="Asics logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/Skechers design.png') }}" alt="Sketchers logo" class="Logo">
        <img src="{{ url_for('static', filename='Images/Under Armour design.png') }}" alt="Under Armour logo" class="Logo">

     </header>
    <!-- Shared Nav Bar -->
     <nav class="w3-bar w3-gray">
        <a href="/" class="w3-bar-item w3-button">Home</a>
        <a href="/brand" class="w3-bar-item w3-button">Brands</a>
        <a href="/admin" class="w3-bar-item w3-button w3-right">Admin</a>
     </nav>
        {% block body %}
    {% endblock %}
</body>
</html>
